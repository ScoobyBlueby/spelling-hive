<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="Honeycomb Spelling">
<meta name="application-name" content="Honeycomb Spelling">

<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">

<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Honeycomb Spelling</title>
<style>
/* Layout: one centered column on a sky ground. Sticker look: thick ink outlines and hard drop shadows.
   The play stage is the biggest sticker, and the child's own bee speaks the sentence in a speech bubble. */
:root {
  --ground: #C6E8FF;
  --cloud: rgba(255, 255, 255, .7);
  --surface: #FFFDF6;
  --ink: #221C45;
  --ink-soft: #544D78;
  --outline: #221C45;
  --line: #DAD4EE;
  --pip: rgba(34, 28, 69, .2);
  --honey: #FFB81C;
  --honey-deep: #875000;
  --honey-wash: #FFEEBF;
  --on-honey: #221C45;
  --pop: #FF6FA3;
  --good: #17753F;
  --good-wash: #D2F3DE;
  --miss: #BF2F2A;
  --miss-wash: #FFDEDA;
  --focus: #2456E0;

  --display: ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: ui-rounded, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --letters: ui-monospace, "SF Mono", "Menlo", "Consolas", "Courier New", monospace;

  --t-xs: .8125rem;
  --t-s: .9375rem;
  --t-m: 1.0625rem;
  --t-l: 1.4375rem;
  --t-xl: 2.125rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #161B3D; --cloud: rgba(255, 255, 255, .05); --surface: #272F60; --ink: #F4F1FF; --ink-soft: #B7B4D8;
    --outline: #070918; --line: #3F4885; --pip: rgba(244, 241, 255, .22);
    --honey: #FFC533; --honey-deep: #FFD777; --honey-wash: #4A3A12; --on-honey: #221C45; --pop: #FF8DB8;
    --good: #6BE0A5; --good-wash: #15402D; --miss: #FF958C; --miss-wash: #4D2422; --focus: #9DBBFF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #161B3D; --cloud: rgba(255, 255, 255, .05); --surface: #272F60; --ink: #F4F1FF; --ink-soft: #B7B4D8;
  --outline: #070918; --line: #3F4885; --pip: rgba(244, 241, 255, .22);
  --honey: #FFC533; --honey-deep: #FFD777; --honey-wash: #4A3A12; --on-honey: #221C45; --pop: #FF8DB8;
  --good: #6BE0A5; --good-wash: #15402D; --miss: #FF958C; --miss-wash: #4D2422; --focus: #9DBBFF;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  color: var(--ink);
  font-family: var(--body); font-weight: 500; font-size: var(--t-m); line-height: 1.5;
  padding-inline: 16px; padding-block: 16px 56px;
  background-color: var(--ground);
  background-image:
    radial-gradient(ellipse 74px 26px at 10% 70px, var(--cloud) 98%, transparent),
    radial-gradient(ellipse 42px 24px at calc(10% + 30px) 52px, var(--cloud) 98%, transparent),
    radial-gradient(ellipse 86px 28px at 88% 168px, var(--cloud) 98%, transparent),
    radial-gradient(ellipse 46px 26px at calc(88% - 34px) 148px, var(--cloud) 98%, transparent);
  background-repeat: no-repeat;
}
.app { max-width: 46rem; margin-inline: auto; display: flex; flex-direction: column; gap: 26px; }
h1, h2, h3, p { margin: 0; }
h1 { font-family: var(--display); font-weight: 700; font-size: var(--t-xl); line-height: 1.1; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 600; font-size: var(--t-l); line-height: 1.15; text-wrap: balance; }
h3 { font-family: var(--display); font-weight: 600; font-size: var(--t-m); }
b { font-weight: 800; }
.soft { color: var(--ink-soft); }
.small { font-size: var(--t-s); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
button, input, select { font: inherit; color: inherit; }
.bee { display: block; width: 100%; height: auto; overflow: visible; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: var(--t-l); }
#brand-bee { width: 44px; flex: none; }
.nav { display: flex; flex-wrap: wrap; gap: 6px; }
.nav button { background: transparent; border: 3px solid transparent; border-radius: 999px; padding: 4px 14px; cursor: pointer; font-family: var(--display); font-weight: 600; font-size: var(--t-m); }
.nav button[aria-current="page"] { background: var(--honey); color: var(--on-honey); border-color: var(--outline); box-shadow: 0 3px 0 var(--outline); }

/* buttons */
.btn { background: var(--honey); color: var(--on-honey); border: 3px solid var(--outline); border-radius: 16px; padding: 10px 22px; font-family: var(--display); font-weight: 600; font-size: 1.1875rem; cursor: pointer; box-shadow: 0 5px 0 var(--outline); transition: transform .06s, box-shadow .06s; }
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--outline); }
.btn.quiet { background: var(--surface); color: var(--ink); font-size: var(--t-m); padding: 8px 18px; }
.btn.danger { background: var(--miss); color: var(--surface); }
.btn:disabled { opacity: .5; cursor: default; }
.link { background: none; border: 0; padding: 4px 0; color: var(--ink-soft); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: var(--t-s); }
.link:hover { color: var(--ink); }

/* views */
.view { display: flex; flex-direction: column; gap: 22px; }
.lede { max-width: 38rem; color: var(--ink-soft); font-weight: 700; }
.lede.small { font-weight: 500; }
.title-row { display: flex; align-items: center; gap: 16px; }
.title-row .bee { width: 88px; flex: none; }
.title-row h1 { min-width: 0; overflow-wrap: anywhere; }

/* home */
.players { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.pcard { background: var(--surface); border: 3px solid var(--outline); border-radius: 24px; box-shadow: 0 6px 0 var(--outline); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.pcard.test { grid-column: 1 / -1; border-style: dashed; box-shadow: none; }
.pc-top { display: flex; align-items: center; gap: 14px; }
.avbtn { background: none; border: 0; padding: 0; width: 78px; flex: none; cursor: pointer; border-radius: 50%; transition: transform .12s; }
.avbtn:hover { transform: rotate(-6deg) scale(1.06); }
.avstill { width: 78px; flex: none; }
.pc-head { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pc-head h2 { overflow-wrap: anywhere; }
.tag { font-size: var(--t-xs); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
.strip { display: block; width: 100%; max-width: 20rem; height: auto; }
.pc-stats { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: var(--t-s); color: var(--ink-soft); font-weight: 700; }
.pc-stats b { color: var(--ink); font-family: var(--display); font-weight: 600; font-variant-numeric: tabular-nums; font-size: var(--t-l); }
.pc-go { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; margin-top: auto; }
.pc-links { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.pc-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-top: auto; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .field .lab { font-size: var(--t-xs); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
.field input[type="text"], .field select { background: var(--surface); border: 3px solid var(--outline); border-radius: 12px; padding: 7px 12px; width: 100%; min-width: 0; font-weight: 700; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.row > .field { flex: 1 1 9rem; }

/* play */
.playbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.who { font-family: var(--display); font-weight: 600; font-size: var(--t-l); overflow-wrap: anywhere; }
.pips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.pip { width: 17px; height: 19px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: var(--pip); }
.pip.now { background: var(--ink); }
.pip.ok { background: var(--good); }
.pip.no { background: var(--honey); }
.stage { position: relative; background: var(--surface); border: 3px solid var(--outline); border-radius: 28px; box-shadow: 0 8px 0 var(--outline); padding: 24px 22px 28px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.hear { background: none; border: 0; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: var(--display); font-weight: 600; font-size: 1.1875rem; border-radius: 16px; }
.hear svg { width: 104px; height: 127px; overflow: visible; }
.hear-shadow { fill: var(--outline); stroke: var(--outline); stroke-width: 4; stroke-linejoin: round; }
.hear-hex { fill: var(--honey); stroke: var(--outline); stroke-width: 4; stroke-linejoin: round; }
.hear-top { transition: transform .06s; }
.hear:hover .hear-top { transform: translateY(-2px); }
.hear:active .hear-top { transform: translateY(6px); }
.hear-ico path { fill: var(--on-honey); stroke: var(--on-honey); }
.hear-ico .wave { fill: none; }
.aux { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 20px; }
.talk { display: flex; align-items: center; gap: 18px; width: 100%; max-width: 34rem; }
#play-bee { width: 88px; flex: none; }
.bubble { position: relative; flex: 1; min-width: 0; background: var(--honey-wash); border: 3px solid var(--outline); border-radius: 20px; padding: 12px 16px; }
.bubble::before, .bubble::after { content: ""; position: absolute; top: 50%; border-style: solid; border-color: transparent; }
.bubble::before { left: -17px; margin-top: -10px; border-width: 10px 14px 10px 0; border-right-color: var(--outline); }
.bubble::after { left: -11px; margin-top: -7px; border-width: 7px 10px 7px 0; border-right-color: var(--honey-wash); }
.sentence { font-size: var(--t-l); font-weight: 700; line-height: 1.3; text-wrap: balance; }
.blank { display: inline-block; width: 4.2em; border-bottom: 4px solid var(--ink); border-radius: 2px; transform: translateY(-.1em); margin-inline: .1em; }
.answer { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; width: 100%; max-width: 32rem; }
.answer input { flex: 1 1 12rem; min-width: 0; font-family: var(--letters); font-weight: 700; font-size: 1.5rem; letter-spacing: .08em; text-align: center; background: var(--surface); border: 3px solid var(--outline); border-radius: 16px; padding: 9px 12px; box-shadow: inset 0 4px 0 var(--line); }
.answer input:disabled, .answer input[readonly] { opacity: .6; }
.feedback { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; text-align: center; min-height: 1.5rem; }
.fb-title { font-family: var(--display); font-weight: 700; font-size: var(--t-l); }
.fb-title.good { color: var(--good); }
.fb-title.miss { color: var(--miss); }
.tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; row-gap: 10px; }
.tile { font-family: var(--letters); font-weight: 700; font-size: clamp(1.05rem, 4.6vw, 1.6rem); width: clamp(1.15rem, 5vw, 2.1rem); text-align: center; line-height: 1.55; background: var(--surface); border: 2px solid var(--outline); border-radius: 8px; box-shadow: 0 3px 0 var(--outline); }
.tile.ok { background: var(--good-wash); }
.tile.bad { background: var(--miss-wash); color: var(--miss); border-color: var(--miss); box-shadow: 0 3px 0 var(--miss); }
.tile.gap { color: var(--miss); background: none; border-color: transparent; box-shadow: none; width: clamp(.6rem, 2.6vw, .9rem); }
.tile.mark { background: var(--honey-wash); border-color: var(--honey-deep); box-shadow: 0 3px 0 var(--honey-deep); }
.tile.win { background: var(--honey); color: var(--on-honey); animation: pop .4s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes pop { from { transform: translateY(8px) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
.tip { max-width: 32rem; font-size: var(--t-s); color: var(--ink-soft); text-align: left; border-left: 4px solid var(--honey); padding-left: 12px; }
.tip b { color: var(--ink); }
.note { font-size: var(--t-s); color: var(--ink-soft); font-weight: 700; }
.burst { position: absolute; left: 50%; top: 96px; width: 0; height: 0; pointer-events: none; }
.burst i { position: absolute; width: 14px; height: 16px; margin: -8px 0 0 -7px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: var(--honey); animation: fly .8s ease-out both; }
.burst i:nth-child(3n) { background: var(--pop); }
.burst i:nth-child(3n+1) { background: var(--good); }
@keyframes fly { from { transform: translate(0, 0) scale(.4); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(1.1) rotate(var(--rot)); opacity: 0; } }
.bob { animation: bob 2.6s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
.hop { animation: hop .42s ease-out 2; }
@keyframes hop { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-16px) rotate(-8deg); } }
.shake { animation: shake .35s ease-in-out 1; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
@media (prefers-reduced-motion: reduce) { .tile.win, .bob, .hop, .shake { animation: none; } .burst { display: none; } }

/* end-of-round flight */
#flight { position: fixed; inset: 0; z-index: 50; pointer-events: none; overflow: hidden; }
.flyer { position: absolute; left: 0; top: 0; will-change: transform; }
.fly .wing-l, .fly .wing-r { transform-box: view-box; }
.fly .wing-l { transform-origin: 40px 60px; animation: flap-l .09s linear infinite alternate; }
.fly .wing-r { transform-origin: 60px 60px; animation: flap-r .09s linear infinite alternate; }
@keyframes flap-l { from { transform: rotate(16deg); } to { transform: rotate(-24deg); } }
@keyframes flap-r { from { transform: rotate(-16deg); } to { transform: rotate(24deg); } }
.drop { position: absolute; width: 12px; height: 14px; margin: -7px 0 0 -6px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: var(--honey); animation: drop .9s ease-in both; }
.drop.alt { background: var(--pop); }
@keyframes drop { from { transform: scale(1); opacity: .95; } to { transform: translateY(46px) scale(.3) rotate(140deg); opacity: 0; } }
#done-bee { width: 88px; flex: none; }
#test-bee { display: block; width: 56px; flex: none; }

/* round done */
.score { display: flex; flex-wrap: wrap; gap: 12px 36px; }
.stat b { display: block; font-family: var(--display); font-weight: 700; font-size: 2.5rem; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: var(--t-s); color: var(--ink-soft); font-weight: 700; }
.unlock { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; background: var(--surface); border: 3px solid var(--outline); border-radius: 24px; box-shadow: 0 6px 0 var(--pop); padding: 14px 18px; }
.unlock .bee { width: 84px; }
.unlock .who-new { flex: 1 1 10rem; min-width: 0; }
.unlock .tag { color: var(--pop); }
.sheet { background: var(--surface); border: 3px solid var(--outline); border-radius: 24px; box-shadow: 0 6px 0 var(--outline); padding: 18px; }
.wordlist { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); gap: 6px 20px; }
.wordlist li { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-bottom: 2px dashed var(--line); padding-block: 6px; }
.wordlist .w { font-family: var(--letters); font-weight: 700; overflow-wrap: anywhere; }
.chip { font-size: var(--t-xs); font-weight: 800; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.chip.ok { background: var(--good-wash); color: var(--good); }
.chip.no { background: var(--honey-wash); color: var(--honey-deep); }
.chip.bad { background: var(--miss-wash); color: var(--miss); }

/* bee picker */
.bees { display: grid; grid-template-columns: repeat(auto-fill, minmax(9rem, 1fr)); gap: 18px 16px; }
.beecard { position: relative; background: var(--surface); border: 3px solid var(--outline); border-radius: 22px; box-shadow: 0 6px 0 var(--outline); padding: 14px 10px 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; min-width: 0; }
button.beecard { cursor: pointer; transition: transform .1s; }
button.beecard:hover { transform: translateY(-3px); }
.beecard .bee { width: 88px; margin-bottom: 4px; }
.beecard b { font-family: var(--display); font-weight: 600; font-size: 1.1875rem; }
.beecard small { font-size: var(--t-xs); font-weight: 700; color: var(--ink-soft); line-height: 1.3; }
.beecard[aria-pressed="true"] { background: var(--honey); color: var(--on-honey); }
.beecard[aria-pressed="true"] small { color: var(--on-honey); }
.beecard.locked { background: transparent; border-style: dashed; box-shadow: none; }
.beecard.locked .bee { filter: grayscale(1); opacity: .45; }
.beecard.can { border-style: solid; border-color: var(--honey-deep); background: var(--honey-wash); }
.beecard.can .bee { filter: none; opacity: 1; }
.btn.small { font-size: var(--t-s); padding: 6px 12px; border-radius: 12px; box-shadow: 0 4px 0 var(--outline); margin-top: 6px; }
.bank { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; background: var(--surface); border: 3px solid var(--outline); border-radius: 18px; box-shadow: 0 5px 0 var(--outline); padding: 8px 16px; align-self: flex-start; font-weight: 700; }
.hd { width: 20px; height: 26px; flex: none; align-self: center; }
.bank b { font-family: var(--display); font-weight: 700; font-size: var(--t-xl); line-height: 1; font-variant-numeric: tabular-nums; }
.bank .link { margin-left: 8px; }
#pick-bee { width: 88px; flex: none; }
.beecard .bar { width: 80%; margin-top: 4px; }
.lock { position: absolute; top: 10px; right: 10px; width: 22px; height: 22px; color: var(--ink-soft); }

/* honey shelf */
.badge { display: block; width: 100%; height: auto; }
.badge text { font-family: var(--display); font-weight: 700; }
.shelf { display: flex; flex-direction: column; gap: 10px; border-bottom-width: 9px; border-bottom-color: var(--honey-deep); box-shadow: none; }
.shelf-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.shelf-head span { font-size: var(--t-s); font-weight: 700; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(6.5rem, 1fr)); gap: 18px 8px; margin-top: 6px; }
.bcard { display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; min-width: 0; }
.bcard .badge { width: 78px; margin-bottom: 2px; }
.bcard b { font-family: var(--display); font-weight: 600; font-size: var(--t-m); line-height: 1.15; overflow-wrap: anywhere; }
.bcard small { font-size: var(--t-xs); font-weight: 700; color: var(--ink-soft); line-height: 1.25; }
.bcard .bar { width: 76%; height: 9px; margin-top: 3px; }
.bcard.locked .badge { filter: grayscale(1); opacity: .38; }
.bcard.locked b { color: var(--ink-soft); }
.total { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.total .bar { flex: 1 1 10rem; height: 16px; border: 2px solid var(--outline); }
.total b { font-family: var(--display); font-weight: 700; font-size: var(--t-l); font-variant-numeric: tabular-nums; }
.newrow { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-top: 8px; }
.newrow figure { margin: 0; width: 5.5rem; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
.newrow .badge { width: 64px; }
.newrow figcaption { font-family: var(--display); font-weight: 600; font-size: var(--t-s); line-height: 1.15; }

/* toggle */
.seg { display: inline-flex; flex-wrap: wrap; background: var(--surface); border: 3px solid var(--outline); border-radius: 16px; box-shadow: 0 4px 0 var(--outline); padding: 3px; gap: 3px; align-self: flex-start; }
.seg button { background: none; border: 0; border-radius: 10px; padding: 5px 16px; cursor: pointer; font-family: var(--display); font-weight: 600; color: var(--ink-soft); overflow-wrap: anywhere; }
.seg button[aria-pressed="true"] { background: var(--honey); color: var(--on-honey); }

/* hive */
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: var(--t-s); font-weight: 700; color: var(--ink-soft); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { width: 16px; height: 18px; }
.combs { display: grid; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); gap: 26px 28px; }
.comb { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.comb-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.comb-head span { font-size: var(--t-s); font-weight: 700; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
.comb svg { width: 100%; height: auto; display: block; }
.hx { fill: var(--honey); stroke: var(--honey-deep); stroke-width: 1.5; cursor: pointer; }
.hx.s0 { fill-opacity: 0; stroke: var(--line); }
.hx.s1 { fill-opacity: .22; }
.hx.s2 { fill-opacity: .55; }
.hx.s3 { fill-opacity: 1; stroke: var(--outline); stroke-width: 2; }
.hx.trouble { stroke: var(--miss); stroke-width: 2.5; }
.hx:focus { outline: none; }
.hx.on { stroke: var(--ink); stroke-width: 3; }
.hx:focus-visible { stroke: var(--focus); stroke-width: 3; }
.hexinfo { font-size: var(--t-s); color: var(--ink-soft); min-height: 1.5em; }
.hexinfo b { font-family: var(--letters); color: var(--ink); }

/* grown-ups */
.panel { display: flex; flex-direction: column; gap: 14px; background: var(--surface); border: 3px solid var(--outline); border-radius: 24px; box-shadow: 0 6px 0 var(--outline); padding: 18px; }
.prow { display: grid; grid-template-columns: minmax(0, 14rem) minmax(0, 1fr) minmax(0, 12rem); gap: 4px 14px; align-items: center; padding-block: 8px; border-bottom: 2px dashed var(--line); font-size: var(--t-s); }
.prow .pname { font-weight: 800; }
.bar { height: 12px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 999px; }
.bar i.lo { background: var(--miss); } .bar i.mid { background: var(--honey); } .bar i.hi { background: var(--good); }
.prow .num { color: var(--ink-soft); font-variant-numeric: tabular-nums; text-align: right; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips .chip { font-family: var(--letters); font-size: var(--t-s); }
.check { display: flex; gap: 10px; align-items: flex-start; }
.check input { width: 20px; height: 20px; margin-top: 3px; flex: none; accent-color: var(--honey-deep); }
.confirm { background: var(--miss-wash); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.confirm .row { align-items: center; }
.qrbox { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; border: 3px solid var(--outline); border-radius: 18px; padding: 14px; max-width: 26rem; }
.qr { display: block; width: 100%; max-width: 23rem; height: auto; border-radius: 6px; }
.panel h3 { margin-top: 6px; }
textarea.code { font-family: var(--letters); font-size: var(--t-xs); line-height: 1.4; width: 100%; background: var(--surface); color: var(--ink); border: 3px solid var(--outline); border-radius: 12px; padding: 8px 10px; word-break: break-all; resize: vertical; }
.msg-ok { color: var(--good); font-weight: 700; }
.msg-no { color: var(--miss); font-weight: 700; }
ol.plain { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 4px; max-width: 38rem; }

@media (max-width: 34rem) {
  .players { grid-template-columns: minmax(0, 1fr); }
  .prow { grid-template-columns: minmax(0, 1fr); }
  .prow .num { text-align: left; }
  .stage { padding: 20px 12px 24px; }
  .answer input { flex-basis: 100%; }
  .answer .btn { flex: 1 1 auto; }
  .talk { gap: 14px; }
  #play-bee { width: 64px; }
  .sentence { font-size: 1.1875rem; }
  .title-row .bee, #done-bee, #pick-bee { width: 68px; }
  .nav button { padding: 3px 9px; font-size: var(--t-s); }
  .badges { grid-template-columns: repeat(auto-fill, minmax(6rem, 1fr)); }
  .bcard .badge { width: 68px; }
}

<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span id="brand-bee"></span>
      <span>Honeycomb Spelling</span>
    </div>
    <nav class="nav" aria-label="Sections">
      <button type="button" data-go="home" aria-current="page">Spell</button>
      <button type="button" data-go="hive">Hive</button>
      <button type="button" data-go="shelf">Honey Shelf</button>
      <button type="button" data-go="grown">Grown-ups</button>
    </nav>
  </header>

  <main>
    <section class="view" id="v-home"></section>

    <section class="view" id="v-play" hidden>
      <div class="playbar">
        <span class="who" id="play-who"></span>
        <div class="pips" id="pips" aria-hidden="true"></div>
        <button type="button" class="link" id="quit">End round</button>
      </div>
      <div class="stage">
        <button type="button" class="hear" id="hear">
          <svg viewBox="0 0 104 127" aria-hidden="true">
            <polygon class="hear-shadow" points="52,10 101,38 101,96 52,124 3,96 3,38"/>
            <g class="hear-top">
            <polygon class="hear-hex" points="52,3 101,31 101,89 52,117 3,89 3,31"/>
            <g class="hear-ico" id="ico-speak" transform="translate(31,42) scale(1.55)">
              <path d="M2 9v6h4l5 4V5L6 9H2z"/>
              <path class="wave" d="M14.5 8.5a5 5 0 0 1 0 7M17.5 5.5a9 9 0 0 1 0 13" stroke-width="2" stroke-linecap="round"/>
            </g>
            <g class="hear-ico" id="ico-eye" transform="translate(30,42) scale(1.8)" hidden>
              <path class="wave" d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" stroke-width="2" stroke-linejoin="round"/>
              <path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"/>
            </g>
            </g>
          </svg>
          <span id="hear-label">Hear the word</span>
        </button>
        <div class="aux" id="aux">
          <button type="button" class="link" id="hear-sent">Hear the sentence</button>
          <button type="button" class="link" id="hear-slow">Say it slower</button>
          <button type="button" class="link" id="peek">I can't hear it</button>
        </div>
        <div class="talk"><div id="play-bee"></div><p class="sentence bubble" id="sentence"></p></div>
        <div class="tiles" id="flash" hidden></div>
        <form class="answer" id="answer-form" autocomplete="off">
          <label class="sr" for="answer">Type the word</label>
          <input id="answer" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="type here">
          <button type="submit" class="btn" id="check">Check</button>
        </form>
        <div class="feedback" id="feedback" aria-live="polite"></div>
        <div class="burst" id="burst" aria-hidden="true"></div>
      </div>
    </section>

    <section class="view" id="v-done" hidden></section>
    <section class="view" id="v-bees" hidden></section>
    <section class="view" id="v-hive" hidden></section>
    <section class="view" id="v-shelf" hidden></section>
    <section class="view" id="v-grown" hidden></section>
  </main>
</div>

const PATTERNS = [
{ id:'dbl', name:'Double the last letter', tip:'Short vowel and one consonant at the end? Double it before -ing, -ed or -er (hop, hopping). In longer words, double only when the last syllable is the loud one (beGIN, beginning).', words:[
'hopping|4|The rabbit went hopping across the yard.',
'stopped|4|The bus stopped at the corner.',
'swimming|4|We went swimming in the lake.',

'planned|4|We planned a surprise party for Dad.',

'making|4|Dad is making pancakes for breakfast.',
'writing|4|She is writing a letter to her cousin.',
'shining|4|The sun is shining on the water.',

'caring|4|The nurse was kind and caring.',
'scary|4|That movie was too scary for me.',
'famous|4|The famous singer waved to the crowd.',
'amazing|4|The view from the mountain was amazing.',
'dining|5|We ate in the dining room.|dine + ing, one n.',
'arriving|5|The train is arriving at noon.',
'nervous|5|I felt nervous before the spelling test.',

'creative|5|Her creative idea won the art contest.',
'hopeful|5|We are hopeful that the rain will stop.|The ending starts with a consonant, so the e stays.',

'families|4|Many families came to the picnic.',
'easier|4|This puzzle is easier than the last one.',
'hurried|4|We hurried to catch the bus.',
'worried|4|Mom was worried when we were late.',
'studies|4|He studies for an hour every night.',
'replied|4|She replied to my message right away.',
'happiness|5|The gift filled her with happiness.',
'beautiful|5|The sunset was beautiful tonight.|beauty + ful: the y turns into i.',

'earliest|5|This is the earliest I have ever woken up.',
'heaviest|5|He lifted the heaviest box.',
'denied|5|He denied eating the last cookie.',

{ id:'shun', name:'-tion, -sion, -cian', tip:'The "shun" sound is usually spelled -tion. Use -sion after an s, or when it sounds like "zhun" (decision). Use -cian for a person (music, musician).', words:[
'action|4|The movie was full of action.',
'nation|4|The whole nation watched the game.',
'question|4|Raise your hand to ask a question.',
'vacation|4|We are going on vacation in July.',
'direction|4|The wind changed direction.',
'collection|4|He has a large collection of rocks.',
'attention|5|Please pay attention to the directions.',
'invention|5|The telephone was an important invention.',
'education|5|A good education opens many doors.',

'confusion|5|There was confusion about the meeting time.',
'explosion|5|The explosion could be heard for miles.',
'magician|5|The magician pulled a coin from my ear.|magic + ian: a person.',
'musician|5|The musician tuned her guitar.|music + ian: a person.',
'discussion|6|We had a class discussion about the book.|discuss + ion keeps both s\'s.',
'permission|6|You need permission to leave early.',

'electrician|6|The electrician fixed the broken light.|electric + ian: a person.' ]},
{ id:'able', name:'-able or -ible', tip:'If you can see a whole word inside, it is usually -able (comfort, comfortable). If the first part is not a word on its own, it is often -ible (poss, possible).', words:[
'possible|4|Is it possible to finish by noon?',
'terrible|4|The storm made a terrible noise.',
'horrible|4|The medicine had a horrible taste.',
'enjoyable|4|The picnic was very enjoyable.',
'comfortable|4|This chair is very comfortable.|comfort + able.',
'valuable|5|The old coin is very valuable.',
'available|5|Tickets are available at the front desk.',
'reasonable|5|The price of the bike was reasonable.',
'dependable|5|A dependable friend keeps promises.',
'remarkable|5|She made a remarkable recovery.',
'acceptable|5|A late paper is not acceptable.',
'visible|5|The moon was visible through the clouds.',
'sensible|5|Wearing a helmet is a sensible choice.',
'invisible|5|The ink was invisible until we heated the paper.',
'flexible|5|A gymnast has to be very flexible.',

'unnecessary|6|Bringing two umbrellas was unnecessary.|un + necessary: two n\'s.',

'piece|4|May I have a piece of pie?|A piece of pie.',
'field|4|The cows are grazing in the field.',
'believe|4|I believe you can do it.',
'weigh|4|How much does the puppy weigh?',
'eight|4|The spider has eight legs.',
'chief|4|The fire chief spoke to our class.',
'thief|5|The thief was caught by the police.',
'niece|5|My niece is learning to walk.',
'brief|5|The mayor gave a brief speech.',
'shield|5|The knight held up his shield.',
'neighbor|5|Our neighbor has a friendly dog.',
'weight|5|The weight of the backpack hurt my shoulders.',
'height|5|The nurse measured my height.',
'ceiling|5|A spider crawled across the ceiling.|After c, it is ei.',

'weird|6|We heard a weird noise in the attic.|A rule-breaker: weird is weird.',
'achieve|6|You can achieve your goal with practice.',
'foreign|6|She speaks two foreign languages.',
'receipt|6|Keep the receipt in case you return the shoes.|After c, it is ei. The p is silent.',
'seize|6|The guards tried to seize the stolen gold.|A rule-breaker.',
'deceive|6|The trick was meant to deceive the audience.|After c, it is ei.' ]},
{ id:'silent', name:'Silent letters', tip:'Some letters are written but not said. Say the word the silly way in your head (k-night, lis-ten), or think of a related word where you can hear the letter (sign, signal).', words:[
'knight|4|The knight rode a white horse.',
'wrist|4|She wears a watch on her wrist.',
'climb|4|We will climb the hill after lunch.',
'thumb|4|I hit my thumb with the hammer.',
'listen|4|Please listen to the directions.',
'answer|4|Do you know the answer to the riddle?',
'island|4|The boat sailed to a small island.|An island is land.',
'castle|4|The king lived in a stone castle.',
'wrinkle|5|Iron the shirt to remove the wrinkle.',
'whistle|5|The coach blew her whistle.',
'honest|5|An honest person tells the truth.',
'sword|5|The pirate waved his sword.',
'doubt|5|I doubt that it will rain today.',
'autumn|5|The leaves turn red in autumn.',

'muscle|5|He pulled a muscle in his leg.|You can hear the c in muscular.',
'knowledge|6|Reading adds to your knowledge.|know + ledge.',
'column|6|Add the numbers in the first column.|You can hear the n in columnist.',
'rhyme|6|The words cat and hat rhyme.',
'gnaw|6|Beavers gnaw on tree trunks.' ]},
{ id:'roots', name:'Greek and Latin roots', tip:'Long words are built from parts that keep their spelling. Find the part you know: tele (far), graph (write), port (carry), struct (build), spect (look), dict (say), rupt (break), aud (hear).', words:[
'telephone|4|The telephone rang during dinner.|tele (far) + phone (sound).',
'transport|4|Trucks transport food to the stores.|trans (across) + port (carry).',
'inspect|4|The chef will inspect the kitchen.|in + spect (look).',

'there|4|Put the box over there.|there = a place. It has "here" inside it.',
'they\'re|4|I think they\'re coming to the party.|they\'re = they are.',

'its|4|The dog wagged its tail.|its = belongs to it. No apostrophe.',

'threw|4|She threw the ball to first base.|threw = the past of throw.',
'through|4|The train went through the tunnel.',

'whether|5|I cannot decide whether to walk or ride.|whether = if.',

'effect|6|The medicine had a good effect.|effect is the result.',

'favorite|4|Blue is my favorite color.|fa-vor-ite.',

const WORDS = [];
const WORD_BY_ID = {};
const PAT_BY_ID = {};
PATTERNS.forEach(function (p) {
  PAT_BY_ID[p.id] = p;
  p.list = p.words.map(function (s) {
    const parts = s.split('|');
    const w = { id: parts[0].toLowerCase().replace(/'/g, '_'), w: parts[0], g: +parts[1], s: parts[2], h: parts[3] || '', pat: p.id };
    WORDS.push(w); WORD_BY_ID[w.id] = w;
    return w;

/* ----- the bee's victory lap: it takes off from the heading, loops around the screen, and lands back ----- */
let flight = null;
function stopFlight() {
  const home = flight && flight.home;
  if (flight) cancelAnimationFrame(flight.raf);
  flight = null;
  const layer = $('flight'); layer.innerHTML = ''; layer.hidden = true;
  if (home) home.style.visibility = '';
}
/* home is where the bee takes off from and lands: the round-done heading, or the test spot in Grown-ups.
   Returns false when the device asks for reduced motion and the flight is skipped. */
function flyBee(pid, home) {
  stopFlight();
  home = home || $('done-bee');
  const layer = $('flight');
  if (!home) return false;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return false;
  const base = home.getBoundingClientRect().width || 88;
  const big = Math.max(72, Math.min(120, Math.min(window.innerWidth, window.innerHeight) * 0.2)) / base;
  layer.hidden = false;
  layer.innerHTML = '<div class="flyer" style="width:' + base + 'px">' + beeSVG(avOf(pid), 'cheer', 'fly') + '</div>';
  const bee = layer.firstChild;
  home.style.visibility = 'hidden';
  const me = flight = { raf: 0, home: home };
  const dur = 5200, t0 = performance.now(), turn = Math.random() < 0.5 ? 1 : -1;
  const ease = function (v) { v = Math.max(0, Math.min(1, v)); return v * v * (3 - 2 * v); };
  let lastX = null, lastDrop = 0, drops = 0;
  function frame(now) {
    if (flight !== me) return;
    if (!home.isConnected) return stopFlight();
    const t = Math.min(1, (now - t0) / dur), W = window.innerWidth, H = window.innerHeight;
    const r = home.getBoundingClientRect(), hx = r.left + r.width / 2, hy = r.top + r.height / 2;
    const fx = W * (0.5 + 0.4 * turn * Math.sin(Math.PI * 2 * 1.5 * t));
    const fy = H * (0.46 - 0.3 * Math.sin(Math.PI * 2 * 2.5 * t));
    const k = Math.min(ease(t / 0.14), 1 - ease((t - 0.8) / 0.2));     /* 0 = sitting in the heading, 1 = free flight */
    const x = hx + (fx - hx) * k, y = hy + (fy - hy) * k;
    const tilt = lastX === null ? 0 : Math.max(-24, Math.min(24, (x - lastX) * 1.8));
    lastX = x;
    bee.style.transform = 'translate(' + (x - base / 2).toFixed(1) + 'px,' + (y - base / 2).toFixed(1) + 'px) rotate(' + tilt.toFixed(1) + 'deg) scale(' + (1 + (big - 1) * k).toFixed(3) + ')';
    if (k > 0.4 && now - lastDrop > 70) {
      lastDrop = now;
      const d = document.createElement('i');
      d.className = 'drop' + (++drops % 3 === 0 ? ' alt' : '');
      d.style.left = x.toFixed(0) + 'px'; d.style.top = (y + base * 0.3).toFixed(0) + 'px';
      layer.insertBefore(d, bee);
      setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 900);
    }
    if (t < 1) { me.raf = requestAnimationFrame(frame); return; }
    /* landed: put the bee back in the heading with a hop and a burst */
    flight = null;
    home.style.visibility = '';
    const svg = home.firstChild; if (svg && svg.classList) svg.classList.add('hop');
    let out = '';
    for (let n = 0; n < 14; n++) {
      const a = Math.PI * 2 * n / 14 + Math.random() * 0.4, dist = 50 + Math.random() * 60;
      out += '<i style="--dx:' + Math.round(Math.cos(a) * dist) + 'px;--dy:' + Math.round(Math.sin(a) * dist) + 'px;--rot:' + Math.round(Math.random() * 360) + 'deg"></i>';
    }
    layer.innerHTML = '<div class="burst" style="left:' + hx.toFixed(0) + 'px;top:' + hy.toFixed(0) + 'px">' + out + '</div>';
    setTimeout(function () { if (!flight) { layer.innerHTML = ''; layer.hidden = true; } }, 1000);
  }
  frame(t0);   /* place the bee on its spot before the first paint */
  return true;
}

  if (t.dataset.sel) { sel = t.dataset.sel; confirmReset = false; qrv = { pid: '', links: [], i: 0, msg: '' }; return show(view); }
  if (t.dataset.hex) return hexInfo(t.dataset.hex);
  if (t.dataset.bees) { sel = t.dataset.bees; confirmBee = ''; return show('bees'); }
  if (t.dataset.shelf) { sel = t.dataset.shelf; return show('shelf'); }
  if (t.dataset.bee) {
    const p = state.players[sel], a = AV_BY_ID[t.dataset.bee];
    if (a && ownsBee(p, a)) { p.av = a.id; p.pt = Date.now(); confirmBee = ''; savePlayer(sel); ding(false); renderBees(); }
    return;
  }
  if (t.dataset.buyAsk) { confirmBee = t.dataset.buyAsk; return renderBees(); }
  if (t.dataset.buyNo) { confirmBee = ''; return renderBees(); }
  if (t.dataset.buy) {
    const p = state.players[sel], a = AV_BY_ID[t.dataset.buy];
    confirmBee = '';
    if (a && buyBee(p, a)) {
      p.av = a.id; p.pt = Date.now(); savePlayer(sel);
      renderBees(); window.scrollTo(0, 0);
      playSound('fanfare'); flyBee(sel, $('pick-bee'));
    } else renderBees();
    return;
  }
  if (t.id === 'xfer-make') {
    makeCode().then(function (code) {
      xfer.code = code;
      xfer.outMsg = code ? '' : 'Nobody on this device has a name yet, so there is nothing to move.';
      if (view === 'grown') { renderGrown(); const o = $('xfer-out'); if (o) { o.focus(); o.select(); } }
    });
    return;
  }
  if (t.id === 'xfer-copy') {
    const done = function (msg) { xfer.outMsg = msg; const el = $('xfer-out-status'); if (el) el.textContent = msg; };
    const byHand = function () { const o = $('xfer-out'); if (o) { o.focus(); o.select(); } done('Could not copy it for you. The code is selected, so copy it by hand.'); };
    try { navigator.clipboard.writeText(xfer.code).then(function () { done('Copied.'); }, byHand); } catch (e) { byHand(); }
    return;
  }
  if (t.id === 'xfer-share') { try { navigator.share({ title: 'Honeycomb Spelling transfer code', text: xfer.code }).catch(function () {}); } catch (e) { /* not available */ } return; }
  if (t.id === 'xfer-load') {
    const box = $('xfer-in'), status = $('xfer-in-status');
    if (!box.value.trim()) { box.focus(); return; }
    xfer.inMsg = ''; status.textContent = '';
    readCode(box.value).then(function (list) {
      const res = importPlayers(list);
      const ok = res.filter(function (r) { return r.ok; }), no = res.filter(function (r) { return !r.ok; });
      xfer.inMsg = (ok.length ? '<span class="msg-ok">Brought in ' + ok.map(function (r) { return esc(r.name) + ' (' + r.words + (r.words === 1 ? ' word' : ' words') + ')'; }).join(', ') + '.</span> ' : '')
        + (no.length ? '<span class="msg-no">No free place for ' + no.map(function (r) { return esc(r.name); }).join(', ') + '. Both speller places here are taken by other names.</span>' : '')
        + (!res.length ? '<span class="msg-no">That code has no spellers in it.</span>' : '');
      if (view === 'grown') renderGrown();
    }, function (err) {
      status.innerHTML = '<span class="msg-no">' + (err && err.message === 'shape' ? 'That does not look like a transfer code. Copy the whole code, starting with HC, and try again.'
        : err && err.message === 'old' ? 'This browser is too old to read that code.'
        : 'That code is incomplete or damaged. Copy it again from the other device.') + '</span>';
    });
    return;
  }
  if (t.id === 'fly-test') {
    if (!flyBee(sel, $('test-bee'))) $('fly-status').textContent = 'This device is set to reduce motion, so the flight is skipped.';
    return;
  }
  if (t.dataset.arrivalClose) { arrival = null; return renderHome(); }
  if (t.id === 'qr-show') {
    qrv = { pid: '', links: [], i: 0, msg: '' };
    if (!state.players[sel].name) qrv.msg = 'Give this speller a name first.';
    else if (!siteBase()) qrv.msg = 'Type the website address of the game first, starting with https://';
    else { qrv.pid = sel; qrv.links = makeQRLinks(sel); }
    renderGrown();
    const box = $('qrbox'); if (box) box.scrollIntoView({ block: 'center' });
    return;
  }
  if (t.id === 'qr-next' || t.id === 'qr-prev') { qrv.i = Math.max(0, Math.min(qrv.links.length - 1, qrv.i + (t.id === 'qr-next' ? 1 : -1))); renderGrown(); const box = $('qrbox'); if (box) box.scrollIntoView({ block: 'center' }); return; }
  if (t.id === 'qr-hide') { qrv = { pid: '', links: [], i: 0, msg: '' }; return renderGrown(); }
  if (t.id === 'unlock-all') {
    const p = state.players.t, now = Date.now();
    AVATARS.forEach(function (a) { if (a.cost) p.un[a.id] = p.un[a.id] || now; });
    BADGES.forEach(function (b) { p.bd[b.id] = p.bd[b.id] || now; });
    savePlayer('t'); sel = 't'; return show('shelf');
  }
  if (t.id === 'hear' && it) { if (flashMode()) flashWord(false); else say([it.w.w]); if (!round.flashing) $('answer').focus(); return; }
  if (t.id === 'hear-sent' && it) { say([it.w.s]); return $('answer').focus(); }
  if (t.id === 'hear-slow' && it) { say([it.w.w], 0.55); return $('answer').focus(); }
  if (t.id === 'peek' && it) return flashWord(true);
  if (t.id === 'quit') { round = null; return show('home'); }
  if (t.id === 'voice-test') return say(['Spell the word: honeycomb.']);
  if (t.id === 'ding-test' || t.id === 'fanfare-test') {
    playSound(t.id === 'ding-test' ? 'first' : 'fanfare', true).then(function (res) {
      const el = $('ding-status'); if (!el) return;
      el.textContent = res === 'played'
        ? 'The sound was sent to the speaker. If you heard nothing, turn up the media volume.'
        : 'This device blocked the sound. Try opening the page in a web browser instead of the app.';
    });
    return;
  }
  if (t.id === 'reset-ask') { confirmReset = true; return renderGrown(); }
  if (t.id === 'reset-no') { confirmReset = false; return renderGrown(); }
  if (t.id === 'reset-yes') {
    const p = state.players[sel];
    state.players[sel] = playerFrom(sel, { name: p.name, grade: p.grade, av: p.av, pt: p.pt, rz: Date.now() });
    confirmReset = false; savePlayer(sel); return renderGrown();
  }
});
document.addEventListener('keydown', function (ev) {
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.dataset && ev.target.dataset.hex) { ev.preventDefault(); hexInfo(ev.target.dataset.hex); }
});
document.addEventListener('submit', function (ev) {
  ev.preventDefault();
  const f = ev.target;
  if (f.id === 'answer-form') return onCheck();
  if (f.dataset.setup) {
    const id = f.dataset.setup, name = $('name-' + id).value.trim();
    if (!name) { $('name-' + id).focus(); return; }
    const p = state.players[id];
    p.name = name.slice(0, 20); p.grade = clampInt($('grade-' + id).value, 4, 6); p.pt = Date.now();
    editing[id] = false; savePlayer(id); return renderHome();
  }
  if (f.id === 'g-profile') {
    const p = state.players[sel], name = $('g-name').value.trim();
    if (name) p.name = name.slice(0, 20);
    p.grade = clampInt($('g-grade').value, 4, 6); p.pt = Date.now();
    savePlayer(sel); return renderGrown();
  }
});
document.addEventListener('input', function (ev) {
  if (ev.target.id !== 'answer' || ev.target.readOnly || !round) return;
  keySound(typeof ev.inputType === 'string' && ev.inputType.indexOf('delete') === 0);
});
document.addEventListener('change', function (ev) {
  if (ev.target.id === 'set-len') { state.settings.len = normSettings({ len: ev.target.value }).len; saveSettings(); }
  if (ev.target.id === 'set-flash') { state.settings.flash = ev.target.checked; saveSettings(); }
  if (ev.target.id === 'set-site') { state.settings.site = cleanSite(ev.target.value); ev.target.value = state.settings.site; saveSettings(); }
  if (ev.target.id === 'set-keys') { state.settings.keys = ev.target.checked; saveSettings(); if (ev.target.checked) keySound(false); }
  if (ev.target.id === 'set-sound') { state.settings.sound = ev.target.checked; saveSettings(); if (ev.target.checked) ding(true); }
});

/* ---------- start ---------- */
loadLocal();
if (IDS.filter(function (id) { return checkBadges(state.players[id]).length; }).length) saveLocal();
$('brand-bee').innerHTML = beeSVG(AV_BY_ID.zip, 'happy');
takeScan();
window.addEventListener('hashchange', function () { if (takeScan()) show('home'); });
show('home');
initDb();
</script>
